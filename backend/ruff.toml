# Lint rules for the CI `lint` job. The rule set is pinned here so that a newer
# ruff release cannot change what the gate checks.
[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Tests import shared pytest fixtures and request them by parameter name, which
# ruff reports as an unused import (F401) and a redefinition (F811). Unused
# imports and placeholder-free f-strings are tolerated in test code.
"tests/**" = ["F401", "F811", "F541"]
